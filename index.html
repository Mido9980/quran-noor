<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نُور — القرآن الكريم</title>
<meta name="description" content="نُور: مصحف كامل يعمل بدون إنترنت، بالخط العثماني، مع الترجمة بعدة لغات والاستماع والتلاوة.">
<meta name="theme-color" content="#070b18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نُور">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="grain"></span>
</div>

<header class="topbar" id="topbar">
  <button class="icon-btn only-with-back" id="backBtn" aria-label="رجوع" hidden>
    <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="titles">
    <h1 id="topTitle">نُور</h1>
    <p id="topSub">القرآن الكريم</p>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" aria-label="المظهر">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="searchBtn" aria-label="بحث">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="tab active">
    <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span data-i18n="nav_home">الرئيسية</span>
  </button>
  <button data-tab="read" class="tab">
    <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7.5 4.4 4.5 4.7v13c3-.3 5.5.3 7.5 1.8 2-1.5 4.5-2.1 7.5-1.8v-13c-3-.3-5.5.3-7.5 1.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    <span data-i18n="nav_read">المصحف</span>
  </button>
  <button data-tab="saved" class="tab">
    <svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span data-i18n="nav_saved">المحفوظات</span>
  </button>
  <button data-tab="settings" class="tab">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span data-i18n="nav_settings">الإعدادات</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="player" id="player" hidden>
  <div class="player-info"><span id="playerTitle"></span></div>
  <div class="player-btns">
    <button class="icon-btn" id="prevAyah" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="icon-btn big" id="togglePlay" aria-label="تشغيل"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5.5v13l10-6.5Z" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="nextAyah" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <button class="icon-btn" id="closePlayer" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
